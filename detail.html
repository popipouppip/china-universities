<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Университет — подробно</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f1f4f8;
      --card: #ffffff;
      --border: #dde3ec;
      --accent: #c0392b;
      --accent-light: #fdf2f1;
      --text: #111827;
      --muted: #5a6a80;
      --tag-bg: #eef2ff;
      --tag-color: #3730a3;
      --green: #15803d;
      --green-bg: #f0fdf4;
      --blue: #0369a1;
      --blue-bg: #eff8ff;
      --orange: #c2410c;
      --orange-bg: #fff7ed;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      min-height: 100vh;
    }

    .back-bar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 16px 48px;
      display: flex;
      align-items: center;
    }

    .back-link {
      display: flex; align-items: center; gap: 8px;
      color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500;
      transition: color 0.15s;
    }

    .back-link:hover { color: var(--accent); }

    /* Hero */
    .hero {
      position: relative;
      height: 340px;
      overflow: hidden;
    }

    .hero-img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.72) 100%);
      display: flex;
      align-items: flex-end;
      padding: 36px 48px;
      gap: 24px;
    }

    .hero-logo {
      width: 80px; height: 80px;
      object-fit: contain;
      background: rgba(255,255,255,0.95);
      border-radius: 14px;
      padding: 8px;
      flex-shrink: 0;
    }

    .hero-text { flex: 1; }

    .hero-text h1 {
      font-size: 32px; font-weight: 900; color: #fff;
      line-height: 1.2; letter-spacing: -0.5px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .hero-text .cn {
      font-size: 16px; color: rgba(255,255,255,0.8); margin-top: 5px;
    }

    .hero-badges { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }

    .hero-badge {
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(6px);
      color: #fff;
      font-size: 13px; font-weight: 600;
      padding: 5px 12px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.3);
      display: flex; align-items: center; gap: 5px;
    }

    /* Main layout */
    .main { max-width: 960px; margin: 0 auto; padding: 36px 24px 60px; }

    /* Quick stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 32px;
    }

    .stat-box {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }

    .stat-box .s-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.6px; color: var(--muted); margin-bottom: 8px;
      display: flex; align-items: center; gap: 6px;
    }

    .stat-box .s-value { font-size: 22px; font-weight: 900; color: var(--text); line-height: 1.1; }
    .stat-box .s-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* Sections */
    .section-block {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 28px 30px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .section-title {
      font-size: 18px; font-weight: 800; margin-bottom: 18px;
      display: flex; align-items: center; gap: 10px;
      color: var(--text);
    }

    .section-title svg { color: var(--accent); flex-shrink: 0; }

    .desc { font-size: 15px; line-height: 1.75; color: #2d3748; }

    /* Specialities */
    .spec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }

    .spec-item {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 11px;
      padding: 14px 16px;
    }

    .spec-item h4 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .spec-item p { font-size: 13px; color: var(--muted); line-height: 1.5; }

    /* Partners */
    .partners-grid { display: flex; flex-wrap: wrap; gap: 8px; }

    .partner-tag {
      background: var(--blue-bg); color: var(--blue);
      font-size: 14px; font-weight: 600;
      padding: 6px 14px; border-radius: 8px;
    }

    /* Grants */
    .grants-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .grant-card {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }

    .grant-card h4 {
      font-size: 15px; font-weight: 700; margin-bottom: 10px;
      display: flex; align-items: center; justify-content: space-between;
    }

    .grant-card p { font-size: 14px; color: var(--muted); line-height: 1.6; }

    .grant-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }

    .grant-item {
      display: flex; align-items: flex-start; gap: 10px;
      font-size: 14px; line-height: 1.5;
    }

    .grant-item::before {
      content: '';
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); flex-shrink: 0; margin-top: 7px;
    }

    .diff-badge {
      font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 6px;
    }

    .diff-easy { background: var(--green-bg); color: var(--green); }
    .diff-medium { background: var(--orange-bg); color: var(--orange); }
    .diff-hard { background: #fef2f2; color: #dc2626; }
    .diff-veryhard { background: #fdf2f8; color: #9d174d; }

    /* Pros/cons */
    .pros-cons { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .pro-block, .con-block {
      border-radius: 12px; padding: 18px;
    }

    .pro-block { background: var(--green-bg); border: 1.5px solid #bbf7d0; }
    .con-block { background: #fef2f2; border: 1.5px solid #fecaca; }

    .pro-block h4 { color: var(--green); font-size: 14px; font-weight: 700; margin-bottom: 10px; }
    .con-block h4 { color: #dc2626; font-size: 14px; font-weight: 700; margin-bottom: 10px; }

    .pro-block li, .con-block li {
      font-size: 14px; line-height: 1.6; margin-left: 16px; margin-bottom: 4px;
    }

    /* Apply steps */
    .steps { display: flex; flex-direction: column; gap: 14px; }

    .step {
      display: flex; align-items: flex-start; gap: 16px;
    }

    .step-num {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--accent); color: #fff;
      font-size: 15px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .step-content h4 { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
    .step-content p { font-size: 14px; color: var(--muted); line-height: 1.55; }

    /* Site button */
    .site-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--accent); color: #fff;
      font-size: 15px; font-weight: 700;
      padding: 13px 24px; border-radius: 10px;
      text-decoration: none; transition: background 0.15s;
    }

    .site-btn:hover { background: #a93226; }

    @media (max-width: 680px) {
      .back-bar { padding: 14px 20px; }
      .hero { height: 260px; }
      .hero-overlay { padding: 24px 20px; flex-direction: column; gap: 14px; }
      .hero-text h1 { font-size: 22px; }
      .main { padding: 24px 16px 48px; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .grants-grid, .pros-cons { grid-template-columns: 1fr; }
    }
  </style>

  return `<span class="diff-badge ${classes[key]}">${labels[key]}</span>`;
}
