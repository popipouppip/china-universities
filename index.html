<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Университеты Китая</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f1f4f8;
      --card: #ffffff;
      --border: #dde3ec;
      --accent: #c0392b;
      --accent-light: #fdf2f1;
      --text: #111827;
      --muted: #5a6a80;
      --tag-bg: #eef2ff;
      --tag-color: #3730a3;
      --green: #15803d;
      --green-bg: #f0fdf4;
      --blue-bg: #eff8ff;
      --blue: #0369a1;
      --orange: #c2410c;
      --orange-bg: #fff7ed;
      --shadow: 0 2px 6px rgba(0,0,0,0.07);
      --shadow-hover: 0 10px 32px rgba(0,0,0,0.13);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 16px;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    header > svg { color: var(--accent); flex-shrink: 0; }
    header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.4px; }
    header p { font-size: 14px; color: var(--muted); margin-top: 2px; }

    .lang-btn {
      margin-left: auto;
      display: flex; align-items: center; gap: 8px;
      background: #0e7490; color: #fff;
      font-size: 14px; font-weight: 700;
      padding: 11px 20px; border-radius: 10px;
      text-decoration: none; transition: background 0.15s; flex-shrink: 0;
    }
    .lang-btn:hover { background: #155e75; }
    .lang-btn svg { color: #fff; }

    .profile-btn {
      display: flex; align-items: center; gap: 8px;
      background: var(--accent); color: #fff;
      font-size: 14px; font-weight: 700;
      padding: 11px 20px; border-radius: 10px;
      text-decoration: none; transition: background 0.15s; flex-shrink: 0;
    }
    .profile-btn:hover { background: #a93226; }
    .profile-btn svg { color: #fff; }

    .controls {
      padding: 20px 40px 0;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-btn {
      padding: 9px 20px;
      border-radius: 24px;
      border: 1.5px solid var(--border);
      background: var(--card);
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }

    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .count { margin-left: auto; font-size: 14px; color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      padding: 24px 40px 56px;
    }

    .card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: box-shadow 0.2s, transform 0.2s;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    .card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-4px);
    }

    .campus-photo {
      width: 100%; height: 150px;
      object-fit: cover; display: block;
      background: var(--border);
    }

    .campus-empty {
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--border);
      border-bottom: 1.5px solid var(--border);
    }

    .card-body { padding: 16px; display: flex; flex-direction: column; gap: 13px; }

    .card-header { display: flex; align-items: flex-start; gap: 12px; }

    .uni-logo {
      width: 46px;
      height: 46px;
      object-fit: contain;
      flex-shrink: 0;
      border-radius: 9px;
      border: 1.5px solid var(--border);
      background: #fff;
      padding: 4px;
    }

    .card-title { flex: 1; }
    .card-title h2 {
      font-size: 15px; font-weight: 800; line-height: 1.3;
      min-height: 49px; display: flex; align-items: center;
    }
    .card-title h2.long { font-size: 12.5px; line-height: 1.3; letter-spacing: -0.1px; }
    .card-title .cn { font-size: 11px; color: var(--muted); margin-top: 3px; }

    .card-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: -4px; }

    .city-badge {
      display: flex; align-items: center; gap: 4px;
      background: var(--accent-light); color: var(--accent);
      font-size: 11px; font-weight: 600;
      padding: 3px 8px; border-radius: 6px; white-space: nowrap;
    }

    .site-link {
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; color: var(--blue); text-decoration: none; font-weight: 500;
    }

    .site-link:hover { text-decoration: underline; }

    .ratings { display: flex; gap: 5px; flex-wrap: nowrap; min-height: 28px; align-items: flex-start; }

    .rating-pill {
      display: flex; align-items: center; gap: 5px;
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 7px; padding: 4px 7px;
      font-size: 10.5px; color: var(--muted); white-space: nowrap;
    }

    .rating-pill strong { color: var(--text); font-weight: 700; font-size: 11.5px; }
    .rating-pill svg { flex-shrink: 0; }
    .rating-pill { min-width: 0; }
    .rating-pill strong { overflow: hidden; text-overflow: ellipsis; }

    .prices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .price-box { background: var(--bg); border-radius: 10px; padding: 10px 12px; }
    .price-box .label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .price-box .value { font-size: 15px; font-weight: 800; color: var(--text); white-space: nowrap; }
    .price-box .sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

    .price-total {
      grid-column: 1 / -1;
      background: var(--accent-light); border-radius: 12px; padding: 10px 12px;
    }
    .price-total .label { font-size: 10px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .price-total .value { font-size: 20px; font-weight: 800; color: var(--accent); white-space: nowrap; }
    .price-total .sub { font-size: 11px; color: var(--accent); opacity: 0.8; margin-top: 1px; }

    .sort-select {
      padding: 9px 16px;
      border-radius: 24px;
      border: 1.5px solid var(--border);
      background: var(--card);
      font-size: 14px; font-weight: 500; color: var(--muted);
      font-family: inherit; cursor: pointer;
      transition: all 0.15s;
    }
    .sort-select:hover { border-color: var(--accent); color: var(--accent); }
    .sort-select.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }

    .section { display: flex; flex-direction: column; gap: 7px; }

    .section-label {
      display: flex; align-items: center; gap: 6px;
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.6px; color: var(--muted);
    }

    .tags { display: flex; flex-wrap: wrap; gap: 5px; }

    .tag {
      background: var(--tag-bg); color: var(--tag-color);
      font-size: 12px; padding: 3px 9px; border-radius: 5px; font-weight: 500;
    }

    .tag.partner { background: var(--blue-bg); color: var(--blue); }

    /* Grant block */
    .grants-block {
      background: var(--bg);
      border-radius: 10px;
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .grant-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

    .grant-label { font-size: 12px; color: var(--muted); font-weight: 500; }

    .csc-badge { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 5px; }
    .csc-yes { background: var(--green-bg); color: var(--green); }
    .csc-no { background: #fef2f2; color: #dc2626; }

    .difficulty { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 5px; }
    .diff-easy { background: var(--green-bg); color: var(--green); }
    .diff-medium { background: var(--orange-bg); color: var(--orange); }
    .diff-hard { background: #fef2f2; color: #dc2626; }
    .diff-veryhard { background: #fdf2f8; color: #9d174d; }

    .grant-note { font-size: 11px; color: var(--muted); line-height: 1.4; }

    .level-bar { display: flex; align-items: center; gap: 10px; }

    .bar-track { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #e74c3c); border-radius: 3px; }
    .bar-label { font-size: 12px; font-weight: 800; color: var(--text); min-width: 46px; text-align: right; }

    .divider { height: 1px; background: var(--border); }

    .card-footer { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }

    .note { font-size: 12px; color: var(--muted); line-height: 1.5; flex: 1; }

    .one-plus-one {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 6px; white-space: nowrap;
    }

    .one-plus-one.yes { background: var(--green-bg); color: var(--green); }
    .one-plus-one.no { background: #fef2f2; color: #dc2626; }

    .detail-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--accent); color: #fff;
      font-size: 13px; font-weight: 600;
      padding: 9px 15px; border-radius: 8px;
      text-decoration: none; transition: background 0.15s;
      margin-top: 2px;
    }

    .detail-btn:hover { background: #a93226; }

    @media (max-width: 1200px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 640px) {
      header { padding: 18px 20px; flex-wrap: wrap; }
      header h1 { font-size: 21px; }
      .lang-btn, .profile-btn { flex: 1; justify-content: center; padding: 11px 14px; font-size: 13px; }
      .controls { padding: 16px 20px 0; }
      .grid { padding: 16px 20px 40px; grid-template-columns: 1fr; }
      .sort-select, .filter-btn { flex: 1 1 auto; }
      .count { margin-left: 0; width: 100%; }
      .card-title h2 { min-height: 0; }
    }
  </style>
</head>

// Цены: "26 000–30 000" -> [26000, 30000]
function parseRange(str) {
  const nums = String(str).split(/[–—-]/)
    .map(part => parseInt(part.replace(/[^0-9]/g, ''), 10))
    .filter(n => !isNaN(n));
  return nums.length ? [nums[0], nums[nums.length - 1]] : [0, 0];
}
const fmtNum = n => n.toLocaleString('ru-RU').replace(/\s/g, '\u00A0');
const nbsp = str => String(str).replace(/ (?=\d)/g, '\u00A0');
const totalRange = u => {
  const t = parseRange(u.tuition), h = parseRange(u.housing);
  return [t[0] + h[0], t[1] + h[1]];
};
const totalText = u => {
  const [min, max] = totalRange(u);
  return min === max ? fmtNum(min) : `${fmtNum(min)}–${fmtNum(max)}`;
};

let curFilter = 'all', curSort = 'default';

function filter(type, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  curFilter = type;
  apply();
}

function setSort(value) {
  curSort = value;
  document.getElementById('sort').classList.toggle('on', value !== 'default');
  apply();
}

function apply() {
  const type = curFilter;
  let list = universities;
  if (type === 'shenzhen') list = universities.filter(u => u.cityKey === 'shenzhen');
  if (type === 'guangzhou') list = universities.filter(u => u.cityKey === 'guangzhou');
  if (type === 'beijing') list = universities.filter(u => u.cityKey === 'beijing');
  if (type === 'nanjing') list = universities.filter(u => u.cityKey === 'nanjing');
  if (type === 'other') list = universities.filter(u => !['beijing','shenzhen','nanjing','guangzhou'].includes(u.cityKey));
  if (type === 'csc') list = universities.filter(u => u.grants.csc);

  if (curSort !== 'default') {
    const dir = curSort === 'asc' ? 1 : -1;
    list = [...list].sort((a, b) => dir * (totalRange(a)[0] - totalRange(b)[0]));
  }
  render(list);
}

apply();
</script>
